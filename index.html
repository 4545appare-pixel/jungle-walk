<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="熱帯雨林の小道をひたすら歩き続けるブラウザ3D散歩。時間が流れ、川や遺跡に出会い、夜は焚火を囲む。">
<title>密林散歩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --ground: #070b08;
    --ink: #e8ecdf;
    --ink-dim: #a9b39c;
    --panel: rgba(10, 16, 11, 0.58);
    --panel-solid: #111a13;
    --line: rgba(232, 236, 223, 0.16);
    --accent: #d8c983;
    --accent-ink: #1b1a10;
    --mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    --sans: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    --serif: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--sans); overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #scene.dragging { cursor: grabbing; }

  .hud {
    position: fixed; left: 16px; top: calc(16px + env(safe-area-inset-top, 0px));
    display: grid; gap: 2px; pointer-events: none;
    text-shadow: 0 1px 12px rgba(0,0,0,.55);
    transition: opacity .8s ease;
  }
  .hud .clock { font-family: var(--mono); font-size: 30px; font-weight: 400; letter-spacing: .02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .hud .phase { font-family: var(--serif); font-size: 15px; font-weight: 600; color: var(--accent); letter-spacing: .12em; }
  .hud .dist { font-family: var(--mono); font-size: 12px; color: var(--ink-dim); letter-spacing: .04em; font-variant-numeric: tabular-nums; margin-top: 4px; }

  .panel {
    background: var(--panel);
    -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2);
    border: 1px solid var(--line); border-radius: 10px;
  }

  .intro {
    position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    max-width: 380px; padding: 20px 20px 18px; display: grid; gap: 12px;
  }
  .intro h1 {
    margin: 0; font-family: var(--serif); font-weight: 800; font-size: 34px; letter-spacing: .14em; line-height: 1.1;
    text-wrap: balance;
  }
  .intro p { margin: 0; font-size: 14px; line-height: 1.75; color: var(--ink-dim); }
  .intro .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .intro .err { color: #f0b39a; font-size: 13px; line-height: 1.6; }

  button {
    font: inherit; font-size: 13px; color: var(--ink); background: rgba(232,236,223,.06);
    border: 1px solid var(--line); border-radius: 6px; padding: 9px 13px; cursor: pointer;
    transition: background .2s, border-color .2s;
  }
  button:hover { background: rgba(232,236,223,.12); border-color: rgba(232,236,223,.3); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 500; }
  button.primary:hover { background: #e6d897; }
  button[aria-pressed="true"] .state { color: var(--accent); }
  button .state { font-family: var(--mono); font-size: 11px; color: var(--ink-dim); margin-left: 6px; letter-spacing: .05em; }

  .ctrl {
    position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    left: auto; max-width: calc(100% - 32px);
    padding: 10px; display: grid; gap: 8px; justify-items: end;
    transition: opacity .8s ease;
  }
  .ctrl .btns { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  .ctrl .hint { font-size: 11.5px; color: var(--ink-dim); letter-spacing: .04em; padding-right: 2px; }
  .vol { display: grid; gap: 6px; width: min(340px, 100%); padding: 4px 4px 6px; border-bottom: 1px solid var(--line); margin-bottom: 2px; }
  .vol-row { display: grid; grid-template-columns: 6.2em 1fr 3.2em; align-items: center; gap: 10px; font-size: 13px; }
  .vol-row label { color: var(--ink); }
  .vol-row output { font-family: var(--mono); font-size: 12px; color: var(--ink-dim); text-align: right; font-variant-numeric: tabular-nums; }
  .vol input[type=range] { width: 100%; accent-color: var(--accent); height: 22px; cursor: pointer; }
  .vol-note { font-size: 11.5px; color: var(--accent); }
  button[aria-expanded="true"] { border-color: var(--accent); }

  body.idle .hud, body.idle .ctrl { opacity: .18; }
  body.idle .ctrl:hover { opacity: 1; }

  @media (max-width: 560px) {
    .hud .clock { font-size: 24px; }
    .intro h1 { font-size: 28px; }
    .ctrl { left: 16px; justify-items: stretch; }
    .ctrl .btns { justify-content: stretch; }
    .ctrl .btns button { flex: 1 1 auto; }
    .ctrl .hint { text-align: right; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hud, .ctrl { transition: none; }
  }
</style>
</head>
<body>
<canvas id="scene" aria-label="ジャングルの小道を歩く3D映像"></canvas>

<div class="hud" id="hud" aria-live="off">
  <div class="phase" id="phase">朝</div>
  <div class="clock" id="clock">07:00</div>
  <div class="dist" id="dist">歩いた距離 0.00 km</div>
</div>

<section class="intro panel" id="intro">
  <h1>密林散歩</h1>
  <p>熱帯雨林の小道を、ただ歩き続けます。ときどき小道を外れて木々の間を抜け、川や遺跡に出会います。時間は流れ、朝の光から夕暮れ、蛍の夜へ。</p>
  <p id="introHint">ドラッグで見回せます。WASDキーで自分でも歩けます。</p>
  <div class="row">
    <button class="primary" id="startSound" type="button">音ありで歩き出す</button>
    <button id="startMute" type="button">音なしで</button>
  </div>
  <div class="err" id="err" hidden></div>
</section>

<div class="ctrl panel" id="ctrl" hidden>
  <div class="vol" id="volPanel" hidden>
    <div class="vol-row"><label for="vMaster">全体</label><input type="range" id="vMaster" min="0" max="100" step="1"><output id="oMaster"></output></div>
    <div class="vol-row"><label for="vAnimals">生き物</label><input type="range" id="vAnimals" min="0" max="100" step="1"><output id="oAnimals"></output></div>
    <div class="vol-row"><label for="vEnv">風・雨・川</label><input type="range" id="vEnv" min="0" max="100" step="1"><output id="oEnv"></output></div>
    <div class="vol-row"><label for="vFire">焚火</label><input type="range" id="vFire" min="0" max="100" step="1"><output id="oFire"></output></div>
    <div class="vol-row"><label for="vSteps">足音</label><input type="range" id="vSteps" min="0" max="100" step="1"><output id="oSteps"></output></div>
    <div class="vol-note" id="volNote">音がオフです。「音」を押すと鳴ります。</div>
  </div>
  <div class="btns">
    <button id="bSound" type="button" aria-pressed="false">音<span class="state">オフ</span></button>
    <button id="bAuto" type="button" aria-pressed="true">自動散歩<span class="state">オン</span></button>
    <button id="bSpeed" type="button">時の流れ<span class="state">1日＝24分</span></button>
    <button id="bVol" type="button" aria-expanded="false" aria-controls="volPanel">音量</button>
    <button id="bQual" type="button">画質<span class="state">自動</span></button>
    <button id="bFull" type="button">全画面</button>
  </div>
  <div class="hint" id="hint">ドラッグで見回す ・ WASD / 矢印キーで歩く</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
'use strict';

const errBox = document.getElementById('err');
function fail(msg) { errBox.textContent = msg; errBox.hidden = false; }
if (typeof THREE === 'undefined') { fail('3D描画ライブラリを読み込めませんでした。通信状況を確認して、ページを再読み込みしてください。'); return; }

/* ------------------------------------------------------------------ 設定 */
const coarse = matchMedia('(pointer: coarse)').matches;
function gpuName() {
  try {
    const c = document.createElement('canvas'), gl = c.getContext('webgl2') || c.getContext('webgl');
    const ext = gl.getExtension('WEBGL_debug_renderer_info');
    return String(ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER));
  } catch (e) { return ''; }
}
// 画質：GPU名で自動判定（RTXなど高性能GPUは最高画質）。画質ボタンで固定もできる
const GPU = gpuName();
let forcedTier = null; try { forcedTier = localStorage.getItem('jungle-walk-quality'); } catch (e) {}
const autoTier = coarse ? 'low' : /RTX|Radeon RX ?[6-9]\d{3}|Arc A7|Apple M\d (Pro|Max|Ultra)/i.test(GPU) ? 'ultra' : (navigator.hardwareConcurrency || 8) <= 4 ? 'low' : 'high';
const tier = ['low', 'high', 'ultra'].includes(forcedTier) ? forcedTier : autoTier;
const lowQ = tier === 'low';
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const Q = tier === 'ultra'
  ? { pr: Math.min(devicePixelRatio, 2), shadow: 4096, shadowR: 52, big: 165, pole: 300, mid: 320, sap: 900, epi: 6, palm: 60, upalm: 320, fern: 3000, bigleaf: 650, herb: 2600, bush: 320, tuft: 18000, liana: 320, log: 40, rock: 60, root: 110, mound: 150, bank: 700, rays: 30, dust: 700, fire: 220, refl: true, reflScale: 0.75, aniso: 16 }

  ? { pr: Math.min(devicePixelRatio, 1.5), shadow: 1024, shadowR: 30, big: 85, pole: 130, mid: 130, sap: 260, epi: 3, palm: 35, upalm: 110, fern: 1000, bigleaf: 240, herb: 800, bush: 120, tuft: 5500, liana: 100, log: 18, rock: 26, root: 45, mound: 60, bank: 260, rays: 10, dust: 260, fire: 90, refl: false, reflScale: 0.5, aniso: 4 }
  : { pr: Math.min(devicePixelRatio, 2), shadow: 2048, shadowR: 44, big: 130, pole: 240, mid: 260, sap: 700, epi: 5, palm: 50, upalm: 260, fern: 2400, bigleaf: 500, herb: 2000, bush: 260, tuft: 14000, liana: 260, log: 34, rock: 50, root: 90, mound: 120, bank: 550, rays: 24, dust: 520, fire: 170, refl: true, reflScale: 0.5, aniso: 8 };
if (coarse) document.getElementById('introHint').textContent = 'ドラッグで見回せます。歩くのは自動です。';
if (coarse) document.getElementById('hint').textContent = 'ドラッグで見回す';

const V3 = THREE.Vector3;

/* ------------------------------------------------------------------ 乱数・ノイズ */
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = mulberry(20260924);
const rr = (a, b) => a + (b - a) * R();
function hash2(x, z) { let h = Math.imul(x, 374761393) + Math.imul(z, 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function vnoise(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  const a = hash2(xi, zi), b = hash2(xi + 1, zi), c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function pathX(z) { return 7 * Math.sin(z * 0.021) + 3.2 * Math.sin(z * 0.057 + 1.3) + 1.2 * Math.sin(z * 0.13 + 0.4); }

function pathH(x, z) {
  const px = pathX(z), d = x - px, m = Math.exp(-d * d / 7), h = baseH(x, z);
  if (m < 0.002) return h;
  const hp = baseH(px, z) - 0.12;
  return h + (hp - h) * m * 0.85;
}
// 小道の右手を蛇行しながら並走する川
// 川は400mごとの区間で「ある／ない」「左／右」が変わり、区間の端では森の奥へ曲がって離れていく
const SEG = 400, segCache = new Map();
function segInfo(k) {
  let g = segCache.get(k);
  if (!g) {
    g = k === 0 ? { has: 1, side: 1, off: 10 } : { has: hash2(k, 501) < 0.55 ? 1 : 0, side: hash2(k, 502) < 0.5 ? -1 : 1, off: 10 + hash2(k, 503) * 6 };

  }
  return g;
}
function riverX(z) {
  const k = Math.floor(z / SEG), g = segInfo(k);
  if (!g.has) return 1e5;
  const t = (z - k * SEG) / SEG, f = sstep(0, 0.15, t) * sstep(1, 0.85, t);
  return pathX(z) + g.side * (g.off + 2.5 * Math.sin(z * 0.017 + 2.0) + (1 - f) * 70);
}
function riverHW(z) { return 3.2 + 0.9 * Math.sin(z * 0.031 + 0.7) + 0.3 * Math.sin(z * 0.083); }
function waterY(z) { return -0.9 + 0.45 * Math.sin(z * 0.0061 + 1.1) + 0.25 * Math.sin(z * 0.0143 + 0.3); }
function H(x, z) {
  let h = pathH(x, z);

  if (dr > hw + 16) return h;
  const wl = waterY(z), bank = wl + 0.75;
  const fz = sstep(hw + 16, hw + 3, dr);

  }
  const site = nearestSite(z);

  if (sd < 22) h += (site.h - h) * sstep(22, 12, sd);

}
const camp = { on: false, sat: false, level: 0, x: 0, z: 0, y: 0, side: 1, seatX: 0, seatZ: 0 };
// まれに現れる遺跡：およそ450mおき、小道の左手
const SITE_SP = 460, siteCache = new Map();
function siteOf(k) {
  let st = siteCache.get(k);
  if (!st) {
    const z = -20 - k * SITE_SP + (hash2(k, 77) - 0.5) * 140;
    const sg = segInfo(Math.floor(z / SEG)), side = sg.has ? -sg.side : (hash2(k, 92) < 0.5 ? -1 : 1);

}
function nearestSite(z) {
  const k = Math.round((-20 - z) / SITE_SP);
  let best = null, bd = 1e9;
  for (let j = k - 1; j <= k + 1; j++) { const t = siteOf(j), d = Math.abs(t.z - z); if (d < bd) { bd = d; best = t; } }

}
function siteD(x, z, t) { return Math.hypot((x - t.x) * 0.9, (z - t.z) * 0.72); }
const smooth = t => t * t * (3 - 2 * t);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

/* ------------------------------------------------------------------ レンダラ */
const canvas = document.getElementById('scene');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: !lowQ, powerPreference: 'high-performance' });
} catch (e) { fail('この端末・ブラウザでは3D表示（WebGL）が使えないため、映像を表示できません。'); return; }
let pixelRatio = Q.pr;
renderer.setPixelRatio(pixelRatio);
renderer.setSize(innerWidth, innerHeight, false);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
const maxAniso = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x88997a, 0.028);
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.08, 240);
camera.rotation.order = 'YXZ';
camera.layers.enable(1);
// 夜に歩くときのヘッドランプ（暖色、中心が明るく周りへ減衰）
scene.add(camera);
const headLamp = new THREE.SpotLight(0xffd9a8, 0, 32, 0.62, 0.75, 1.6);
headLamp.position.set(0.08, 0.05, 0);
camera.add(headLamp);
const lampTarget = new THREE.Object3D(); lampTarget.position.set(0, -0.35, -4); camera.add(lampTarget); headLamp.target = lampTarget;
let lampL = 0;

const hemi = new THREE.HemisphereLight(0xbfd0e0, 0x3a3a22, 0.8);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d8, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(Q.shadow, Q.shadow);
const sc = sun.shadow.camera;

/* ------------------------------------------------------------------ 手続き的テクスチャ */
function cv(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// ---- 葉：色と法線（1枚ごとに傾き・反り・葉脈の凹凸）を同時に描く
function nrgb(nx, ny) { const l = Math.hypot(nx, ny); if (l > 0.92) { nx *= 0.92 / l; ny *= 0.92 / l; } const nz = Math.sqrt(1 - nx * nx - ny * ny); return `rgb(${(nx * .5 + .5) * 255 | 0},${(ny * .5 + .5) * 255 | 0},${(nz * .5 + .5) * 255 | 0})`; }

// 葉のローカル方向（横ax・縦ay）の傾きを、テクスチャ空間の法線色へ

    const S = g.S;
    for (const it of g.items) {
      const cx = Math.round((x0 - it.bx) / S), cz = Math.round((z0 - it.bz) / S);
      if (cx === it.cx && cz === it.cz) continue;
      it.cx = cx; it.cz = cz;
      let x = it.bx + cx * S; const z = it.bz + cz * S;
      const px = pathX(z), d = x - px, clr = g.clear + it.extra;
      if (Math.abs(d) < clr) x = px + (d < 0 ? -1 : 1) * (clr + Math.abs(d) * 0.6);
      if (g.bank) {
        const rx = riverX(z), dr = Math.abs(x - rx) - riverHW(z);
        if (rx > 5e4 || dr < -2.4 || dr > 0.7) { it.on = false; for (const p of it.parts) { p.m.setMatrixAt(p.i, ZERO); p.m.instanceMatrix.needsUpdate = true; } continue; }
        _tt.makeTranslation(x, Math.max(H(x, z), waterY(z) - 0.05), z);
        for (const p of it.parts) { _mm.multiplyMatrices(_tt, p.L); p.m.setMatrixAt(p.i, _mm); p.m.instanceMatrix.needsUpdate = true; }
        continue;
      }
      if ((!it.wetOK && Math.abs(x - riverX(z)) < riverHW(z) + g.rm + it.extra * 0.5) || siteD(x, z, nearestSite(z)) < g.ruinR || (camp.on && Math.hypot(x - camp.x, z - camp.z) < g.campR)) {
        it.on = false;
        for (const p of it.parts) { p.m.setMatrixAt(p.i, ZERO); p.m.instanceMatrix.needsUpdate = true; }
        continue;
      }
      it.on = true; it.wx = x; it.wz = z;
      _tt.makeTranslation(x, H(x, z), z);
      if (g.trample) { const k = 0.35 + 0.65 * sstep(0.1, 0.9, Math.abs(x - px)); if (k < 0.999) _tt.multiply(_sc.makeScale(1, k, 1)); }
      for (const p of it.parts) { _mm.multiplyMatrices(_tt, p.L); p.m.setMatrixAt(p.i, _mm); p.m.instanceMatrix.needsUpdate = true; }
    }
  }
}

      const Z = cam.z + ((((wz - cam.z) % fireB) + fireB) % fireB) - fireB / 2;
      firePos[i * 3] = X; firePos[i * 3 + 2] = Z;
      firePos[i * 3 + 1] = H(X, Z) + 0.3 + o.y + Math.sin(T * 0.5 + o.ph) * 0.3;
      const b = Math.pow(Math.max(0, Math.sin(T * o.f * 3 + o.ph)), 10) * env.fire * 1.6;
      fireCol[i * 3] = b * 0.75; fireCol[i * 3 + 1] = b; fireCol[i * 3 + 2] = b * 0.3;
    }
    fireGeo.attributes.position.needsUpdate = true; fireGeo.attributes.color.needsUpdate = true;
  }

  {
    const dw = Math.max(0, Math.abs(riverX(st.z) - st.x) - riverHW(st.z));
    const prox = 1 - sstep(1.5, 32, dw);
    updateEvents(dt, hour >= 19.3 || hour < 5.5, prox);
    fireUpdate(dt);
    audioTick({ hour, dt, gust: Math.min(1, gust + rainL * 0.5 + EV.gustK * 0.8), rain: rainL, prox, rdx: riverX(st.z) - st.x, fireL: camp.on ? camp.level : 0, fdx: camp.x - st.x, fdz: camp.z - st.z, yaw });
  }

  // 川面の値
  waterMat.uniforms.uTime.value = T;
  waterMat.uniforms.sunDir.value.copy(sunDir); waterMat.uniforms.sunCol.value.copy(env.sun);
  waterMat.uniforms.sunI.value = sunDir.y > 0 ? env.sunI * lf : 0;
  waterMat.uniforms.skyCol.value.copy(env.hor);
  waterMat.uniforms.amb.value = env.hI * 0.55 + (sunDir.y > 0 ? env.sunI * lf * 0.12 : 0.02);

  renderer.shadowMap.needsUpdate = true;
  const rdx = riverX(st.z) - st.x, dWater = Math.max(0, Math.abs(rdx) - riverHW(st.z));
  if (Q.refl && dWater < 45) {
    // 水面を鏡にして、対岸の木々と空を映す
    const wl = waterY(st.z);
    reflCam.fov = camera.fov + 6; reflCam.aspect = camera.aspect; reflCam.near = camera.near; reflCam.far = camera.far;
    reflCam.updateProjectionMatrix();
    reflCam.position.set(camera.position.x, 2 * wl - camera.position.y, camera.position.z);
    camera.getWorldDirection(tmpV);
    reflCam.up.set(0, 1, 0);
    reflCam.lookAt(camera.position.x + tmpV.x * 10, 2 * wl - (camera.position.y + tmpV.y * 10), camera.position.z + tmpV.z * 10);
    reflCam.updateMatrixWorld();
    texMatrix.set(0.5, 0, 0, 0.5, 0, 0.5, 0, 0.5, 0, 0, 0.5, 0.5, 0, 0, 0, 1).multiply(reflCam.projectionMatrix).multiply(reflCam.matrixWorldInverse);
    waterMat.uniforms.texMatrix.value.copy(texMatrix);
    clipPlane.constant = -(wl - 0.05);
    water.visible = false;
    renderer.setRenderTarget(reflRT);
    renderer.toneMapping = THREE.NoToneMapping;
    renderer.clippingPlanes = [clipPlane];
    const fd = scene.fog.density; scene.fog.density = fd * 0.55;
    renderer.render(scene, reflCam);
    scene.fog.density = fd;
    renderer.clippingPlanes = [];
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.setRenderTarget(null);
    water.visible = true;
    waterMat.uniforms.useRefl.value = 1;
  } else waterMat.uniforms.useRefl.value = 0;

  renderer.render(scene, camera);

  // HUD
  hudAcc += dt;
  if (hudAcc > 0.25) {
    hudAcc = 0;
    const hh = Math.floor(hour), mm = Math.floor((hour - hh) * 60);
    hudClock.textContent = String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
    hudPhase.textContent = phaseName(hour) + (rainL > 0.3 ? '・スコール' : EV.mist > 0.4 ? '・朝霧' : '');
    hudDist.textContent = '歩いた距離 ' + (st.dist / 1000).toFixed(2) + ' km ・ ' + (manual ? '手動' : walkMode === 'camp' ? (camp.sat ? '野営・焚火' : '野営地へ') : walkMode === 'trail' ? '小道' : walkMode === 'forest' ? '木々の間' : '小道へ戻る');
  }
  // 重い端末では解像度を下げる
  if (fpsChecked < 3 && T > 2) {
    fpsAcc += dt; fpsN++;
    if (fpsAcc > 3) {
      const fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; fpsChecked++;
      if (fps < 32 && pixelRatio > 0.75) { pixelRatio = Math.max(0.75, pixelRatio * 0.75); renderer.setPixelRatio(pixelRatio); renderer.setSize(innerWidth, innerHeight, false); sizeRT(); }
    }
  }
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
